[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-project"
version = "0.1.0"
description = "A Python starter project with an aiogram Telegram bot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
python-project = "python_project.cli:main"
telegram-bot = "python_project.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
